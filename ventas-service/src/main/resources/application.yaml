server:
  port: ${VENTAS_PORT:8083}

spring:
  application:
    name: ventas-service
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_VENTAS_NAME:inmaqui_ventas}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USUARIO}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH}
  internal-token: ${INTERNAL_SERVICE_TOKEN}
  catalogo-service-url: ${CATALOGO_SERVICE_URL:http://127.0.0.1:8082}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
